# Publishes the package to npm when a version tag (v0.1.1, v1.0.0, v1.2.3-rc.1) is pushed.
#
# Release with:  npm version patch && git push --follow-tags
#
# Auth is npm trusted publishing (OIDC). npm trusts this repository and this workflow file,
# so no token is stored in GitHub. Set it up once on npmjs.com, after the package exists:
# package settings > Trusted Publisher > GitHub Actions > organization `printfriendly`,
# repository `n8n-nodes-printfriendly`, workflow filename `publish.yml`.
#
# Fallback: if a repository secret named NPM_TOKEN exists, it is used instead. Leave it unset
# once trusted publishing works.
#
# Provenance (`--provenance`) is required by n8n for verified community nodes. npm only
# accepts it from a public repository.
#
# See PUBLISHING.md for the full steps.

name: Publish

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest

    permissions:
      contents: read
      # Lets the job request the OIDC token that npm trusted publishing and provenance use.
      id-token: write

    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # Trusted publishing needs npm 11.5.1 or later.
      - name: Use a current npm
        run: npm install -g npm@^11.5.1

      - name: Check the tag matches package.json
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $version." >&2
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      # Builds, then runs the unit tests. `npm publish` lints and builds again (prepublishOnly).
      - name: Test
        run: npm test

      - name: Use NPM_TOKEN
        if: env.NPM_TOKEN != ''
        run: npm config set "//registry.npmjs.org/:_authToken" "$NPM_TOKEN"

      - name: Publish
        run: npm publish --provenance --access public
